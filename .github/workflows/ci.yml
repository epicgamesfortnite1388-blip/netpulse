# The gates this repository already had commands for but nothing ran automatically.
#
# Before this file, `npm run lint`, the four `tsc --noEmit` passes, the four
# vitest suites, `cargo test` and `npm run test:feed` were all green — but only
# when a human remembered to run them (docs/REPO_STATE_ASSESSMENT_2026-10-06.md,
# defect D1). A regression could therefore land in `main` with every gate
# passing at the time it was last run by hand, which is exactly how the shipped
# installer came to predate the source it was built from.
#
# Windows is the runner on purpose: the product is a Windows desktop app, so the
# platform that compiles the Tauri shell, runs the WebView2-backed audits and
# builds the installer is the platform whose gates mean something. A Linux
# runner would have to skip `cargo test` (webkit2gtk) and could not represent
# the shipped artifact at all.
#
# Deliberately NOT in this workflow: `npm run audit:ci` and the CDP audits. Those
# launch the packaged application and drive its webview over the DevTools
# protocol, so they need a built installer and an interactive Windows desktop.
# They stay a local pre-release gate (`scripts/audit-ci.sh`), not a CI job that
# would have to be disabled to pass.
#
# The one real-webview test that IS here is the navigation backstop, in its own
# `webview-navigation` job. It drives the actual binary through tauri-driver
# (Tauri's WebDriver harness) rather than the DevTools protocol, and it is the
# only way to cover a Rust callback the engine must consult before it acts:
# an in-process test with the mock runtime never navigates, so it would assert
# the policy a second time and the wiring not at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per ref; a new push supersedes an in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint, typecheck, tests, rust, feed
    # `windows-latest` now resolves to `windows-2025-vs2026`. Node 22's
    # node-gyp cannot parse the VS 18 install there, so `npm ci` falls
    # back to a native `better-sqlite3` build and fails before any gate.
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Node 22 is the floor declared in package.json ("engines": ">=22").
      # `cache: npm` keys on package-lock.json, which is committed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The four TypeScript projects typecheck independently — apps/api,
      # apps/web, packages/shared and the Cloudflare worker have separate
      # tsconfigs and separate type environments (DOM, Node, workers-types), so
      # one project passing says nothing about the others.
      - name: Typecheck apps/api
        run: npm run typecheck -w @netpulse/api

      - name: Typecheck apps/web
        run: npm run typecheck -w @netpulse/web

      - name: Typecheck packages/shared
        run: npm run typecheck -w @netpulse/shared

      - name: Typecheck cloud/worker
        run: npm run typecheck -w @netpulse/cloud-worker

      # `--if-present` so a workspace that genuinely has no tests is skipped
      # rather than silently reported as passing.
      - name: Test (all workspaces)
        run: npm run test --workspaces --if-present

      # `tauri.conf.json` declares two BUNDLE resources that `.gitignore` keeps
      # out of the repository — the sidecar payload (`src-tauri/backend/`,
      # staged by `scripts/prepare-desktop.mjs`) and the vendored
      # `WebView2Loader.dll`. The Tauri build script refuses a declared resource
      # whose path is missing and names them one at a time, so a CLEAN CHECKOUT
      # (which is what `actions/checkout` gives every job here) cannot compile:
      #
      #     resource path `backend` doesn't exist
      #     resource path `WebView2Loader.dll` doesn't exist
      #
      # Measured, both of them, on this checkout with exactly those two paths
      # removed. Neither is needed to COMPILE — a debug binary loads its document
      # from the dev server rather than the embedded bundle, and WebView2 comes
      # from the installed runtime — so the paths are created empty here: that is
      # all the build checks, and all this job needs. The real payload still comes
      # from `scripts/prepare-desktop.mjs`, and a release bundle must be built
      # from a tree where that script has run.
      - name: Satisfy the build's resource paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/backend | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/WebView2Loader.dll | Out-Null

      # The Rust core: sidecar supervision, the elevation broker, the secret
      # vault, log redaction, path handling. 145 #[test] functions live here and
      # none of it is reachable from the JS suites.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The updater feed is what a shipped install checks for updates; it is
      # generated by its own script with its own tests.
      - name: Updater feed tests
        run: npm run test:feed

  # Real-webview coverage for the navigation backstop.
  #
  # `navigation::classify` is unit-tested, and `tests/navigation_webview.rs`
  # proves the other half: that `window::create_main_window` installs the
  # callbacks on the webview and that the engine asks them before it navigates
  # or opens a window. Only a real engine can prove that — Tauri's mock runtime
  # never navigates — so the test drives the built binary through
  # `tauri-driver`, Tauri's WebDriver harness. The same session also clicks a raw
  # anchor to prove the in-page guard in `externalNavigation.ts` hands the URL to
  # the `open_external` command before the engine has a navigation to see.
  #
  # A separate job on purpose: it needs a desktop session and two drivers built
  # or downloaded, and a failure here must not mask the unit gates above.
  webview-navigation:
    name: navigation backstop (real webview)
    # Same VS 18 / node-gyp incompatibility as `gates`; pin the image that
    # ships the Visual Studio version Node 22 can build against.
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # `frontendDist` is compiled INTO the binary, so the bundle has to exist
      # (and be current) before the Rust build — otherwise the window would
      # load a missing or stale document and the test would be testing that
      # instead of the backstop.
      - name: Build the web bundle
        run: npm run build -w @netpulse/web

      # Same reason as in `gates` above: the two gitignored bundle resources
      # `tauri.conf.json` declares must EXIST for the build script to run, and a
      # clean checkout has neither. This job drives the webview, never the
      # sidecar, so empty paths are enough.
      - name: Satisfy the build's resource paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/backend | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/WebView2Loader.dll | Out-Null

      - name: Build the desktop binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # A DEBUG binary does not read `frontendDist` at runtime: Tauri sets its
      # `dev` cfg for a debug build, so the window resolves to `build.devUrl`.
      # Without this step nothing answers on that origin, the window shows the
      # engine's error page, and the test's readiness gate fails — correctly, but
      # for a reason that has nothing to do with the backstop. The test asserts
      # the document in the window IS the app, so the origin it was built against
      # has to be served.
      - name: Serve the app document
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'vite-dev.log'
          $dev = Start-Process npm.cmd -ArgumentList 'run','dev','-w','@netpulse/web' `
            -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          "NETPULSE_DEV_PID=$($dev.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append

          $ready = $false
          foreach ($i in 1..45) {
            try {
              $res = Invoke-WebRequest -Uri 'http://localhost:5173/' -UseBasicParsing -TimeoutSec 3
              if ($res.StatusCode -eq 200) { $ready = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) {
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content "$log.err" -ErrorAction SilentlyContinue
            throw 'the dev server never answered on http://localhost:5173/'
          }
          "dev server ready on http://localhost:5173/"

      # The driver must match the WEBVIEW2 RUNTIME the app uses, which is not
      # the same version as the installed Edge browser — a mismatch makes every
      # session fail with "only supports Microsoft Edge version N".
      # msedgedriver-tool reads the runtime's version and fetches that driver.
      - name: Install msedgedriver matching WebView2
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME\.cargo\bin\msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # The test is `#[ignore]`d so `cargo test` never opens a window; this is
      # the one place it runs. It fails rather than skips when a driver or the
      # binary is missing, so a green job means the webview was really driven,
      # the app document really loaded, and each blocked external navigation was
      # really handed to the OS — read from a JSON-lines handoff record the app
      # writes for that run (the test points `NETPULSE_HANDOFF_RECORD` at a temp
      # file of its own), so no message wording is part of the assertion.
      - name: Navigation backstop (real WebView2)
        env:
          NAV_WEBVIEW_APP: ${{ github.workspace }}\src-tauri\target\debug\netpulse-desktop.exe
        run: cargo test --manifest-path src-tauri/Cargo.toml --test navigation_webview -- --ignored --nocapture

      # Last, and on failure too: the server is only needed by the step above.
      - name: Stop the dev server
        if: always()
        shell: pwsh
        run: |
          if ($env:NETPULSE_DEV_PID) {
            Stop-Process -Id $env:NETPULSE_DEV_PID -Force -ErrorAction SilentlyContinue
          }
