#:schema node_modules/wrangler/config-schema.json
# NetPulse cloud backend — the security boundary between the desktop app and D1.
# Secrets (AUTH_SECRET, RESET_PEPPER) are NOT here: `wrangler secret put` owns them.
name = "netpulse-cloud"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat_v2"]

account_id = "7380a67667052f3a7a3b11301ce7a77b"

[[d1_databases]]
binding = "DB"
database_name = "netpulse-cloud"
# Filled after `wrangler d1 create`; the id is not a secret.
database_id = "31f2435b-3c23-42ad-b5b8-3b7f815d17dc"
migrations_dir = "migrations"

[observability]
enabled = true
# No [limits] block: the CPU-limits setting requires a paid plan; Workers'
# default per-request CPU cap applies on Free.
